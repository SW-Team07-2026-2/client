<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<defs>
		<!-- 다크 -->
		<filter id="dark-glow" x="-60%" y="-60%" width="220%" height="220%">
			<feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#0f0e14" flood-opacity="0.9" />
			<feDropShadow dx="0" dy="0" stdDeviation="5.5" flood-color="#ffffff" flood-opacity="0.45" />
		</filter>

		<!-- 라이트 -->
		<filter id="light-glow" x="-60%" y="-60%" width="220%" height="220%">
			<feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.6" />
			<feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#0f0e14" flood-opacity="0.25" />
		</filter>
	</defs>

	<style>
		/* 기본 (라이트 테마): 큰 원 검정, 가운데 작은 원 하양, 다크 외곽 그림자 */
		.lp-outer {
			fill: #14121c;
			filter: url(#light-glow);
		}
		.lp-inner {
			fill: #ffffff;
			filter: url(#light-glow);
		}

		/* 다크 테마: 색상 반전 (큰 원 하양, 가운데 작은 원 검정, 화이트 발광) */
		@media (prefers-color-scheme: dark) {
			.lp-outer {
				fill: #ffffff;
				filter: url(#dark-glow);
			}
			.lp-inner {
				fill: #14121c;
				filter: url(#dark-glow);
			}
		}
	</style>

	<!-- LP판 큰 원 -->
	<circle class="lp-outer" cx="32" cy="32" r="30" />

	<!-- LP판 가운데 작은 원 -->
	<circle class="lp-inner" cx="32" cy="32" r="7.5" />
</svg>