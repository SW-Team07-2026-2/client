<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="text-scale" content="scale" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" />
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
	<!-- Pretendard (토스 스타일 한글 산세리프) -->
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface/dist/tossface.css" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-[#0f0e14] text-[#ecebf3] antialiased">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
